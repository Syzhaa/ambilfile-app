name: ambilfile
description: AmbilFile — berbagi file besar semudah kirim link. Upload tetap jalan di background.
publish_to: 'none'
version: 1.1.0+6

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.9.0
  file_picker: ^10.3.7
  shared_preferences: ^2.5.3
  flutter_foreground_task: ^9.2.2
  wakelock_plus: ^1.3.2
  path_provider: ^2.1.5
  open_filex: ^4.7.0
  uuid: ^4.5.1
  flutter_web_auth_2: ^5.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
